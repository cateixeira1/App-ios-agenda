# Projeto do Xcode gerado pelo XcodeGen (o build na nuvem roda `xcodegen generate`).
name: Expediente
options:
  bundleIdPrefix: br.com.colorsoftware
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Expediente:
    type: application
    platform: iOS
    sources:
      - path: Expediente
    info:
      path: Expediente/Info.plist
      properties:
        CFBundleDisplayName: Expediente
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: O Face ID é usado para abrir o Expediente sem digitar a senha.
        NSContactsUsageDescription: O acesso aos Contatos é usado só quando você pede para importar um cliente dos Contatos ou salvar um cliente nos Contatos do iPhone.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: br.com.colorsoftware.expediente.backup
            UTTypeDescription: Backup do Expediente
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - expedientebackup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.colorsoftware.expediente
        PRODUCT_NAME: Expediente
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  ExpedienteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpedienteTests
    dependencies:
      - target: Expediente
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.colorsoftware.expediente.tests
schemes:
  Expediente:
    build:
      targets:
        Expediente: all
        ExpedienteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExpedienteTests
    archive:
      config: Release
